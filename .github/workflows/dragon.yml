name: 3D Contribution Dragon

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  dragon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender imagemagick python3-pip
          python3 -m pip install --break-system-packages pillow requests

      - name: Download 3D dragon
        run: |
          mkdir -p dragon/assets

          curl -L --fail \
            https://raw.githubusercontent.com/Furkath/threeJS-GLSL_STL-3D-webpage-design/master/bodyy.stl \
            -o dragon/assets/body.stl

          curl -L --fail \
            https://raw.githubusercontent.com/Furkath/threeJS-GLSL_STL-3D-webpage-design/master/head.stl \
            -o dragon/assets/head.stl

          curl -L --fail \
            https://raw.githubusercontent.com/Furkath/threeJS-GLSL_STL-3D-webpage-design/master/jiao.stl \
            -o dragon/assets/jiao.stl

          curl -L --fail \
            https://raw.githubusercontent.com/Furkath/threeJS-GLSL_STL-3D-webpage-design/master/jiao2.stl \
            -o dragon/assets/jiao2.stl

          curl -L --fail \
            https://raw.githubusercontent.com/Furkath/threeJS-GLSL_STL-3D-webpage-design/master/tou.stl \
            -o dragon/assets/tou.stl

          curl -L --fail \
            https://raw.githubusercontent.com/Furkath/threeJS-GLSL_STL-3D-webpage-design/master/wei.stl \
            -o dragon/assets/wei.stl

          echo "Downloaded models:"
          ls -lh dragon/assets

      - name: Get contribution data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import requests
          import json
          import os

          query = """
          query($login:String!) {
            user(login:$login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """

          response = requests.post(
              "https://api.github.com/graphql",
              json={
                  "query": query,
                  "variables": {
                      "login": "hardik563"
                  }
              },
              headers={
                  "Authorization": "bearer " + os.environ["GH_TOKEN"]
              },
              timeout=30
          )

          response.raise_for_status()

          with open("dragon/contributions.json", "w") as f:
              json.dump(response.json(), f)

          print("Contribution data downloaded.")
          PY

      - name: Render real 3D dragon
        run: |
          rm -rf dragon/frames
          mkdir -p dragon/frames

          cat > dragon/render_dragon.py <<'PY'
          import bpy
          import os
          import math
          from mathutils import Vector

          ROOT = os.path.abspath(os.path.dirname(__file__))
          ASSETS = os.path.join(ROOT, "assets")
          FRAMES = os.path.join(ROOT, "frames")

          os.makedirs(FRAMES, exist_ok=True)

          bpy.ops.wm.read_factory_settings(use_empty=True)

          scene = bpy.context.scene

          scene.render.engine = "BLENDER_EEVEE_NEXT"

          scene.render.resolution_x = 1000
          scene.render.resolution_y = 420
          scene.render.resolution_percentage = 100

          scene.render.image_settings.file_format = "PNG"
          scene.render.image_settings.color_mode = "RGBA"
          scene.render.film_transparent = True

          scene.render.fps = 12

          world = bpy.data.worlds.new("Dragon World")
          scene.world = world
          world.use_nodes = True

          world.node_tree.nodes["Background"].inputs["Color"].default_value = (
              0.002,
              0.004,
              0.008,
              1
          )

          world.node_tree.nodes["Background"].inputs["Strength"].default_value = 0.15

          def make_material(name, color, metallic, roughness):

              material = bpy.data.materials.new(name)

              material.use_nodes = True

              bsdf = material.node_tree.nodes.get("Principled BSDF")

              bsdf.inputs["Base Color"].default_value = (
                  color[0],
                  color[1],
                  color[2],
                  1
              )

              bsdf.inputs["Metallic"].default_value = metallic
              bsdf.inputs["Roughness"].default_value = roughness

              return material

          body_material = make_material(
              "Red Dragon Scales",
              (0.38, 0.012, 0.008),
              0.8,
              0.22
          )

          head_material = make_material(
              "Dragon Head",
              (0.28, 0.006, 0.004),
              0.75,
              0.2
          )

          gold_material = make_material(
              "Golden Details",
              (0.65, 0.22, 0.015),
              0.85,
              0.18
          )

          dark_material = make_material(
              "Dark Details",
              (0.06, 0.008, 0.004),
              0.7,
              0.3
          )

          def import_stl(path):

              before = set(bpy.context.scene.objects)

              imported = False

              try:
                  bpy.ops.wm.stl_import(filepath=path)
                  imported = True
              except Exception:
                  pass

              if not imported:
                  try:
                      bpy.ops.import_mesh.stl(filepath=path)
                      imported = True
                  except Exception:
                      pass

              if not imported:
                  raise RuntimeError(
                      "Unable to import STL: " + path
                  )

              after = set(bpy.context.scene.objects)

              return list(after - before)

          model_parts = [
              ("body.stl", body_material),
              ("head.stl", head_material),
              ("jiao.stl", gold_material),
              ("jiao2.stl", gold_material),
              ("tou.stl", dark_material),
              ("wei.stl", gold_material)
          ]

          dragon_objects = []

          for filename, material in model_parts:

              path = os.path.join(
                  ASSETS,
                  filename
              )

              if not os.path.exists(path):
                  print("Missing:", filename)
                  continue

              imported = import_stl(path)

              for obj in imported:

                  if obj.type != "MESH":
                      continue

                  if len(obj.data.materials) == 0:
                      obj.data.materials.append(material)
                  else:
                      obj.data.materials[0] = material

                  dragon_objects.append(obj)

                  print(
                      "Imported:",
                      filename,
                      obj.name
                  )

          if len(dragon_objects) == 0:
              raise RuntimeError(
                  "No dragon meshes were imported."
              )

          root = bpy.data.objects.new(
              "Dragon",
              None
          )

          bpy.context.collection.objects.link(root)

          for obj in dragon_objects:
              obj.parent = root

          min_corner = Vector((999999, 999999, 999999))
          max_corner = Vector((-999999, -999999, -999999))

          for obj in dragon_objects:

              for corner in obj.bound_box:

                  p = obj.matrix_world @ Vector(corner)

                  min_corner.x = min(min_corner.x, p.x)
                  min_corner.y = min(min_corner.y, p.y)
                  min_corner.z = min(min_corner.z, p.z)

                  max_corner.x = max(max_corner.x, p.x)
                  max_corner.y = max(max_corner.y, p.y)
                  max_corner.z = max(max_corner.z, p.z)

          center = (min_corner + max_corner) / 2
          dimensions = max_corner - min_corner

          largest_dimension = max(
              dimensions.x,
              dimensions.y,
              dimensions.z
          )

          for obj in dragon_objects:
              obj.location -= center

          scale = 5.8 / largest_dimension

          root.scale = (
              scale,
              scale,
              scale
          )

          root.rotation_mode = "XYZ"

          root.rotation_euler = (
              math.radians(90),
              0,
              math.radians(-20)
          )

          def add_area_light(
              name,
              location,
              energy,
              color,
              size
          ):

              data = bpy.data.lights.new(
                  name,
                  "AREA"
              )

              data.energy = energy
              data.color = color
              data.shape = "DISK"
              data.size = size

              light = bpy.data.objects.new(
                  name,
                  data
              )

              bpy.context.collection.objects.link(light)

              light.location = location

              direction = (
                  Vector((0, 0, 0))
                  - light.location
              )

              light.rotation_euler = (
                  direction
                  .to_track_quat("-Z", "Y")
                  .to_euler()
              )

          add_area_light(
              "Warm Key",
              (4, -5, 5),
              1300,
              (1.0, 0.45, 0.15),
              5
          )

          add_area_light(
              "Blue Rim",
              (-4, 2, 4),
              1600,
              (0.15, 0.35, 1.0),
              4
          )

          add_area_light(
              "Gold Top",
              (0, 0, 7),
              1100,
              (1.0, 0.7, 0.3),
              3
          )

          camera_data = bpy.data.cameras.new(
              "Dragon Camera"
          )

          camera = bpy.data.objects.new(
              "Dragon Camera",
              camera_data
          )

          bpy.context.collection.objects.link(camera)

          scene.camera = camera

          camera.location = (
              0,
              -10.5,
              2.2
          )

          camera.data.lens = 52

          target = Vector((0, 0, 0))

          direction = target - camera.location

          camera.rotation_euler = (
              direction
              .to_track_quat("-Z", "Y")
              .to_euler()
          )

          TOTAL_FRAMES = 36

          for frame in range(TOTAL_FRAMES):

              progress = frame / TOTAL_FRAMES

              angle = progress * math.tau

              root.rotation_euler = (
                  math.radians(90)
                  + math.sin(angle) * math.radians(3),

                  math.sin(angle * 2)
                  * math.radians(5),

                  math.radians(-20)
                  + math.sin(angle)
                  * math.radians(7)
              )

              root.location.z = (
                  math.sin(angle) * 0.18
              )

              camera.location.x = (
                  math.sin(angle) * 0.7
              )

              camera.location.y = (
                  -10.5
                  + math.cos(angle) * 0.3
              )

              camera.location.z = (
                  2.2
                  + math.sin(angle * 2) * 0.15
              )

              direction = target - camera.location

              camera.rotation_euler = (
                  direction
                  .to_track_quat("-Z", "Y")
                  .to_euler()
              )

              scene.frame_set(frame + 1)

              output = os.path.join(
                  FRAMES,
                  "dragon_%03d.png" % frame
              )

              scene.render.filepath = output

              print(
                  "Rendering frame",
                  frame + 1,
                  "->",
                  output
              )

              result = bpy.ops.render.render(
                  write_still=True
              )

              if result != {"FINISHED"}:
                  raise RuntimeError(
                      "Render failed on frame "
                      + str(frame + 1)
                  )

              if not os.path.exists(output):
                  raise RuntimeError(
                      "Blender did not create "
                      + output
                  )

          print("")
          print("================================")
          print("3D RENDER COMPLETE")
          print("================================")

          print(
              "Frames:",
              len(os.listdir(FRAMES))
          )
          PY

          blender \
            --background \
            --factory-startup \
            --python dragon/render_dragon.py

          echo "Checking rendered frames..."

          find dragon/frames \
            -type f \
            -name "*.png" \
            -print

          COUNT=$(find dragon/frames \
            -type f \
            -name "*.png" | wc -l)

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: Blender created zero PNG frames."
            exit 1
          fi

          echo "SUCCESS: $COUNT frames rendered."

      - name: Build animated GIF
        run: |
          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import json
          import glob
          import os
          import math

          WIDTH = 1000
          HEIGHT = 420

          files = sorted(
              glob.glob(
                  os.path.abspath(
                      "dragon/frames/*.png"
                  )
              )
          )

          print("Found frames:", len(files))

          if not files:
              raise RuntimeError(
                  "No rendered frames found."
              )

          with open(
              "dragon/contributions.json"
          ) as f:
              data = json.load(f)

          days = []

          try:
              weeks = (
                  data["data"]
                  ["user"]
                  ["contributionsCollection"]
                  ["contributionCalendar"]
                  ["weeks"]
              )

              for week in weeks:
                  for day in week["contributionDays"]:
                      days.append(
                          day["contributionCount"]
                      )

          except Exception as e:
              print(
                  "Contribution data unavailable:",
                  e
              )

          days = days[-371:]

          while len(days) < 371:
              days.insert(0, 0)

          maximum = max(days) if days else 1

          background = Image.new(
              "RGBA",
              (WIDTH, HEIGHT),
              (13, 17, 23, 255)
          )

          draw = ImageDraw.Draw(background)

          draw.rounded_rectangle(
              (8, 8, WIDTH - 8, HEIGHT - 8),
              radius=20,
              outline=(48, 54, 61, 255),
              width=2
          )

          colors = [
              (22, 27, 34, 255),
              (14, 68, 41, 255),
              (20, 105, 55, 255),
              (38, 166, 75, 255),
              (57, 211, 83, 255)
          ]

          cell = 13
          gap = 4

          start_x = 55
          start_y = 45

          for index, count in enumerate(days):

              week = index // 7
              day = index % 7

              x = (
                  start_x
                  + week * (cell + gap)
              )

              y = (
                  start_y
                  + day * (cell + gap)
              )

              if count == 0:
                  level = 0
              else:
                  ratio = count / maximum

                  if ratio < 0.25:
                      level = 1
                  elif ratio < 0.50:
                      level = 2
                  elif ratio < 0.75:
                      level = 3
                  else:
                      level = 4

              draw.rounded_rectangle(
                  (
                      x,
                      y,
                      x + cell,
                      y + cell
                  ),
                  radius=3,
                  fill=colors[level]
              )

          result = []

          for index, path in enumerate(files):

              dragon = Image.open(path).convert(
                  "RGBA"
              )

              dragon.thumbnail(
                  (930, 350),
                  Image.Resampling.LANCZOS
              )

              frame = background.copy()

              x = (
                  WIDTH
                  - dragon.width
              ) // 2

              y = (
                  HEIGHT
                  - dragon.height
              ) // 2

              y += int(
                  math.sin(
                      index / len(files)
                      * math.tau
                  ) * 4
              )

              frame.alpha_composite(
                  dragon,
                  (x, y)
              )

              result.append(
                  frame.convert("RGB")
              )

          output = (
              "dragon/contribution-dragon.gif"
          )

          result[0].save(
              output,
              save_all=True,
              append_images=result[1:],
              duration=83,
              loop=0,
              optimize=False
          )

          print(
              "GIF created:",
              output
          )
          PY

      - name: Optimize GIF
        run: |
          mkdir -p dragon/final

          magick \
            dragon/contribution-dragon.gif \
            -coalesce \
            -layers Optimize \
            -colors 256 \
            dragon/final/dragon.gif

          mv \
            dragon/final/dragon.gif \
            dragon/contribution-dragon.gif

          ls -lh \
            dragon/contribution-dragon.gif

      - name: Add license
        run: |
          cat > dragon/THIRD_PARTY_LICENSE.txt <<'EOF'
          3D dragon assets:
          Furkath/threeJS-GLSL_STL-3D-webpage-design

          https://github.com/Furkath/threeJS-GLSL_STL-3D-webpage-design

          License: MIT
          EOF

      - name: Remove old SVG
        run: |
          rm -f dragon/contribution-dragon.svg

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dragon/

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update 3D contribution dragon"
            git push
          fi
