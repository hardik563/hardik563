name: 3D Contribution Dragon

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  dragon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-pip imagemagick
          pip3 install pillow requests

      - name: Download 3D dragon
        run: |
          mkdir -p dragon/assets

          curl -L \
            https://raw.githubusercontent.com/Furkath/threeJS-GLSL_STL-3D-webpage-design/master/bodyy.stl \
            -o dragon/assets/body.stl

          curl -L \
            https://raw.githubusercontent.com/Furkath/threeJS-GLSL_STL-3D-webpage-design/master/head.stl \
            -o dragon/assets/head.stl

          curl -L \
            https://raw.githubusercontent.com/Furkath/threeJS-GLSL_STL-3D-webpage-design/master/jiao.stl \
            -o dragon/assets/jiao.stl

          curl -L \
            https://raw.githubusercontent.com/Furkath/threeJS-GLSL_STL-3D-webpage-design/master/jiao2.stl \
            -o dragon/assets/jiao2.stl

          curl -L \
            https://raw.githubusercontent.com/Furkath/threeJS-GLSL_STL-3D-webpage-design/master/tou.stl \
            -o dragon/assets/tou.stl

          curl -L \
            https://raw.githubusercontent.com/Furkath/threeJS-GLSL_STL-3D-webpage-design/master/wei.stl \
            -o dragon/assets/wei.stl

      - name: Get contribution data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import requests
          import json
          import os

          query = """
          query($login:String!) {
            user(login:$login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """

          r = requests.post(
              "https://api.github.com/graphql",
              json={
                  "query": query,
                  "variables": {"login": "hardik563"}
              },
              headers={
                  "Authorization": f"bearer {os.environ['GH_TOKEN']}"
              }
          )

          r.raise_for_status()

          data = r.json()

          with open("dragon/contributions.json", "w") as f:
              json.dump(data, f)
          PY

      - name: Create Blender scene
        run: |
          cat > dragon/render_dragon.py <<'PY'
          import bpy
          import math
          import os
          import json
          import glob
          import random

          from mathutils import Vector

          ROOT = os.path.abspath(os.path.dirname(__file__))
          ASSETS = os.path.join(ROOT, "assets")
          FRAMES = os.path.join(ROOT, "frames")

          os.makedirs(FRAMES, exist_ok=True)

          bpy.ops.wm.read_factory_settings(use_empty=True)

          scene = bpy.context.scene

          scene.render.engine = "BLENDER_EEVEE_NEXT"
          scene.render.resolution_x = 1000
          scene.render.resolution_y = 420
          scene.render.resolution_percentage = 100

          scene.render.image_settings.file_format = "PNG"
          scene.render.film_transparent = True

          scene.render.image_settings.color_mode = "RGBA"

          scene.render.fps = 12

          world = bpy.data.worlds.new("DragonWorld")
          scene.world = world
          world.use_nodes = True

          bg = world.node_tree.nodes.get("Background")
          bg.inputs["Color"].default_value = (
              0.002,
              0.004,
              0.008,
              1
          )
          bg.inputs["Strength"].default_value = 0.12

          def material(name, color, metallic, roughness):
              m = bpy.data.materials.new(name)
              m.diffuse_color = (*color, 1)
              m.use_nodes = True

              bsdf = m.node_tree.nodes.get("Principled BSDF")

              bsdf.inputs["Base Color"].default_value = (*color, 1)
              bsdf.inputs["Metallic"].default_value = metallic
              bsdf.inputs["Roughness"].default_value = roughness

              return m

          red_gold = material(
              "Dragon Red Gold",
              (0.42, 0.018, 0.012),
              0.72,
              0.22
          )

          gold = material(
              "Dragon Gold",
              (0.65, 0.25, 0.025),
              0.82,
              0.18
          )

          dark_gold = material(
              "Dragon Dark Gold",
              (0.22, 0.055, 0.008),
              0.8,
              0.25
          )

          head_mat = material(
              "Dragon Head",
              (0.34, 0.008, 0.006),
              0.78,
              0.2
          )

          claw_mat = material(
              "Dragon Claws",
              (0.72, 0.48, 0.12),
              0.9,
              0.15
          )

          objects = []

          def import_stl(path):
              before = set(bpy.context.scene.objects)

              try:
                  bpy.ops.wm.stl_import(filepath=path)
              except:
                  bpy.ops.import_mesh.stl(filepath=path)

              after = set(bpy.context.scene.objects)
              new_objects = list(after - before)

              return new_objects

          files = [
              ("body.stl", red_gold),
              ("head.stl", head_mat),
              ("jiao.stl", gold),
              ("jiao2.stl", gold),
              ("tou.stl", dark_gold),
              ("wei.stl", gold)
          ]

          for filename, mat in files:
              path = os.path.join(ASSETS, filename)

              if not os.path.exists(path):
                  continue

              imported = import_stl(path)

              for obj in imported:
                  if obj.type == "MESH":
                      obj.data.materials.append(mat)
                      objects.append(obj)

          if not objects:
              raise RuntimeError("No STL dragon geometry was imported.")

          root = bpy.data.objects.new("DRAGON_ROOT", None)
          bpy.context.collection.objects.link(root)

          for obj in objects:
              obj.parent = root

          min_v = Vector((999999, 999999, 999999))
          max_v = Vector((-999999, -999999, -999999))

          for obj in objects:
              for corner in obj.bound_box:
                  world_corner = obj.matrix_world @ Vector(corner)
                  min_v.x = min(min_v.x, world_corner.x)
                  min_v.y = min(min_v.y, world_corner.y)
                  min_v.z = min(min_v.z, world_corner.z)

                  max_v.x = max(max_v.x, world_corner.x)
                  max_v.y = max(max_v.y, world_corner.y)
                  max_v.z = max(max_v.z, world_corner.z)

          center = (min_v + max_v) / 2
          size = max_v - min_v
          largest = max(size.x, size.y, size.z)

          root.location -= center

          scale = 5.5 / largest
          root.scale = (scale, scale, scale)

          root.rotation_euler = (
              math.radians(90),
              0,
              math.radians(-25)
          )

          root.location.z = 0.1

          for obj in objects:
              if obj.type == "MESH":
                  bevel = obj.modifiers.new(
                      "Micro Surface",
                      "BEVEL"
                  )
                  bevel.width = 0.008
                  bevel.segments = 2

          def add_light(name, location, energy, color, size):
              data = bpy.data.lights.new(
                  name,
                  type="AREA"
              )

              data.energy = energy
              data.color = color
              data.shape = "DISK"
              data.size = size

              obj = bpy.data.objects.new(name, data)
              bpy.context.collection.objects.link(obj)

              obj.location = location

              direction = Vector((0, 0, 0)) - obj.location
              obj.rotation_euler = direction.to_track_quat(
                  "-Z",
                  "Y"
              ).to_euler()

          add_light(
              "Key Light",
              (3, -5, 5),
              1100,
              (1.0, 0.55, 0.25),
              5
          )

          add_light(
              "Rim Light",
              (-4, 2, 4),
              1400,
              (0.15, 0.35, 1.0),
              4
          )

          add_light(
              "Top Light",
              (0, 0, 7),
              900,
              (1.0, 0.75, 0.4),
              3
          )

          camera_data = bpy.data.cameras.new("Dragon Camera")
          camera = bpy.data.objects.new(
              "Dragon Camera",
              camera_data
          )

          bpy.context.collection.objects.link(camera)

          scene.camera = camera

          camera.location = (0, -10.5, 2.2)

          target = Vector((0, 0, 0))

          direction = target - camera.location

          camera.rotation_euler = direction.to_track_quat(
              "-Z",
              "Y"
          ).to_euler()

          camera.data.lens = 52

          root.rotation_mode = "XYZ"

          TOTAL_FRAMES = 36

          for frame in range(TOTAL_FRAMES):

              t = frame / TOTAL_FRAMES
              angle = t * math.tau

              root.rotation_euler[0] = (
                  math.radians(90)
                  + math.sin(angle) * math.radians(3)
              )

              root.rotation_euler[1] = (
                  math.sin(angle * 2) * math.radians(5)
              )

              root.rotation_euler[2] = (
                  math.radians(-25)
                  + math.sin(angle) * math.radians(7)
              )

              root.location.z = (
                  0.08
                  + math.sin(angle) * 0.16
              )

              root.scale = (
                  scale * (1 + math.sin(angle) * 0.018),
                  scale * (1 + math.sin(angle) * 0.018),
                  scale * (1 + math.sin(angle) * 0.018)
              )

              camera.location.x = (
                  math.sin(angle) * 0.65
              )

              camera.location.y = (
                  -10.5
                  + math.cos(angle) * 0.25
              )

              camera.location.z = (
                  2.2
                  + math.sin(angle * 2) * 0.18
              )

              direction = target - camera.location

              camera.rotation_euler = direction.to_track_quat(
                  "-Z",
                  "Y"
              ).to_euler()

              scene.frame_set(frame + 1)

              scene.render.filepath = os.path.join(
                  FRAMES,
                  f"frame_{frame:03d}.png"
              )

              bpy.ops.render.render(write_still=True)

          print("3D dragon rendering complete.")
          PY

          blender \
            --background \
            --python dragon/render_dragon.py

      - name: Build contribution background
        run: |
          cat > dragon/composite.py <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import os
          import json
          import glob
          import math

          W = 1000
          H = 420

          OUT = "dragon/contribution-dragon.gif"

          dark = (13, 17, 23)
          border = (48, 54, 61)

          green = [
              (22, 27, 34),
              (14, 68, 41),
              (20, 105, 55),
              (38, 166, 75),
              (57, 211, 83)
          ]

          with open("dragon/contributions.json") as f:
              data = json.load(f)

          weeks = []

          try:
              weeks = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]
          except:
              weeks = []

          days = []

          for week in weeks:
              for day in week["contributionDays"]:
                  days.append(day["contributionCount"])

          if not days:
              days = [0] * 371

          maximum = max(days) if days else 1

          background = Image.new(
              "RGBA",
              (W, H),
              dark + (255,)
          )

          draw = ImageDraw.Draw(background)

          draw.rounded_rectangle(
              (8, 8, W - 8, H - 8),
              radius=20,
              outline=border + (255,),
              width=2
          )

          start_x = 70
          start_y = 78

          cell = 13
          gap = 4

          for i, value in enumerate(days[-371:]):

              week = i // 7
              day = i % 7

              x = start_x + week * (cell + gap)
              y = start_y + day * (cell + gap)

              if value == 0:
                  level = 0
              else:
                  ratio = value / maximum

                  if ratio < 0.25:
                      level = 1
                  elif ratio < 0.5:
                      level = 2
                  elif ratio < 0.75:
                      level = 3
                  else:
                      level = 4

              draw.rounded_rectangle(
                  (x, y, x + cell, y + cell),
                  radius=3,
                  fill=green[level] + (255,)
              )

          glow = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 0)
          )

          glow_draw = ImageDraw.Draw(glow)

          glow_draw.ellipse(
              (W - 420, 40, W + 100, 500),
              fill=(255, 70, 10, 25)
          )

          glow = glow.filter(
              ImageFilter.GaussianBlur(70)
          )

          background = Image.alpha_composite(
              background,
              glow
          )

          frames = []

          pngs = sorted(
              glob.glob("dragon/frames/*.png")
          )

          for i, path in enumerate(pngs):

              dragon = Image.open(path).convert("RGBA")

              dragon.thumbnail(
                  (920, 340),
                  Image.Resampling.LANCZOS
              )

              x = (W - dragon.width) // 2
              y = 35 + int(
                  math.sin(i / len(pngs) * math.tau) * 5
              )

              frame = background.copy()

              frame.alpha_composite(
                  dragon,
                  (x, y)
              )

              frames.append(
                  frame.convert("RGB")
              )

          if not frames:
              raise RuntimeError("No rendered frames found.")

          frames[0].save(
              OUT,
              save_all=True,
              append_images=frames[1:],
              duration=83,
              loop=0,
              optimize=True,
              disposal=2
          )

          print("GIF created:", OUT)
          PY

          python3 dragon/composite.py

      - name: Optimize GIF
        run: |
          mkdir -p dragon/optimized

          magick \
            dragon/contribution-dragon.gif \
            -coalesce \
            -layers Optimize \
            -colors 256 \
            dragon/optimized/contribution-dragon.gif

          mv \
            dragon/optimized/contribution-dragon.gif \
            dragon/contribution-dragon.gif

      - name: Add license notice
        run: |
          cat > dragon/THIRD_PARTY_LICENSE.txt <<'EOF'
          The 3D dragon STL assets used by this animation are from:

          Furkath/threeJS-GLSL_STL-3D-webpage-design

          Repository:
          https://github.com/Furkath/threeJS-GLSL_STL-3D-webpage-design

          The source repository is released under the MIT License.
          EOF

      - name: Remove old SVG
        run: |
          rm -f dragon/contribution-dragon.svg

      - name: Commit dragon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dragon/contribution-dragon.gif
          git add dragon/contributions.json
          git add dragon/THIRD_PARTY_LICENSE.txt

          git diff --cached --quiet || \
            git commit -m "Update 3D contribution dragon"

          git push
