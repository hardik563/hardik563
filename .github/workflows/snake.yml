name: Generate Snake and Dragon

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/workflows/snake.yml'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Snake and Dragon
        uses: Platane/snk@v3
        with:
          github_user_name: hardik563
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate Dragon
        uses: yoshi389111/github-contribution-grid-dragon@v4
        with:
          github_user_name: hardik563
          outputs: |
            dist/github-contribution-grid-dragon.svg
            dist/github-contribution-grid-dragon-dark.svg?palette=github-dark

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install generated visuals into main branch
        run: |
          mkdir -p assets/generated
          cp dist/github-contribution-grid-snake.svg assets/generated/github-contribution-grid-snake.svg
          cp dist/github-contribution-grid-snake-dark.svg assets/generated/github-contribution-grid-snake-dark.svg
          cp dist/github-contribution-grid-dragon.svg assets/generated/github-contribution-grid-dragon.svg
          cp dist/github-contribution-grid-dragon-dark.svg assets/generated/github-contribution-grid-dragon-dark.svg
          python3 - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          s = s.replace('./assets/contribution-dragon-preview.gif', './assets/generated/github-contribution-grid-dragon.svg')
          p.write_text(s)
          PY

      - name: Commit generated contribution visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/ README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(contrib): refresh snake and dragon"
          for i in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
            sleep $((i * 4))
          done
          echo "::error::Could not push generated contribution visuals."
          exit 1
