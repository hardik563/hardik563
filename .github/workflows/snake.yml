name: Generate Snake and Dragon

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: hardik563
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate Dragon
        uses: yoshi389111/github-contribution-grid-dragon@v4
        with:
          github_user_name: hardik563
          outputs: |
            dist/github-contribution-grid-dragon.svg
            dist/github-contribution-grid-dragon-dark.svg?palette=github-dark

      - name: Deploy Snake and Dragon to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
