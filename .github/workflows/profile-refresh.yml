name: Profile Refresh

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir requests==2.32.3 Pillow==11.3.0

      - name: Generate dark animated contribution snake
        env:
          GITHUB_USER: hardik563
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAKE_OUTPUT: assets/contribution-snake.gif
        run: python scripts/generate_snake_gif.py

      - name: Refresh self-hosted profile data and visuals
        env:
          GH_USER: hardik563
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          START_YEAR: "2023"
          PSI_URL: ""
        run: python .github/scripts/update_readme.py

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/ profile-3d-contrib/ city/
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(profile): refresh Hardik Dhamija animated profile"
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            git pull --rebase origin main
            sleep $((i * 5))
          done
          echo "::error::Could not push generated profile assets."
          exit 1
