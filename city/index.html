<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hardik Dhamija · Lucknow 3D City</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050812;color:#fff;font-family:Inter,system-ui,Segoe UI,sans-serif}
#hud{position:fixed;z-index:5;left:24px;top:20px;pointer-events:none;text-shadow:0 2px 10px #000}
#hud h1{margin:0;font-size:30px;letter-spacing:.5px} #hud p{margin:6px 0;color:#b9c7d8}
#hint{position:fixed;z-index:5;right:24px;bottom:20px;padding:10px 14px;border:1px solid #3c526c;border-radius:12px;background:#08101bcc;color:#dce8f5}
canvas{display:block}
</style>
</head>
<body>
<div id="hud"><h1>Lucknow, Uttar Pradesh</h1><p>Hardik Dhamija · Interactive 3D City</p></div>
<div id="hint">🖱️ Drag to rotate · Wheel to zoom · Right-drag to pan</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x050812); scene.fog=new THREE.Fog(0x050812,80,280);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,500); camera.position.set(95,85,115);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.autoRotate=true; controls.autoRotateSpeed=.45; controls.maxPolarAngle=Math.PI*.48; controls.minDistance=55; controls.maxDistance=190;
scene.add(new THREE.HemisphereLight(0xbfdcff,0x182033,2)); const sun=new THREE.DirectionalLight(0xffd27a,3); sun.position.set(60,110,40); sun.castShadow=true; scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,220),new THREE.MeshStandardMaterial({color:0x151d2a,roughness:.95})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.7}));m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
// city blocks
for(let i=-5;i<=5;i++)for(let j=-4;j<=4;j++){if(Math.abs(i)+Math.abs(j)<2)continue; const h=6+((i*i+j*j*3)%11); box(i*15,0,j*15,9,h,9,0x2b3546)}
// road
const road=new THREE.Mesh(new THREE.PlaneGeometry(220,22),new THREE.MeshStandardMaterial({color:0x10151d}));road.rotation.x=-Math.PI/2;road.position.y=.03;scene.add(road);
// Rumi Darwaza inspired gateway
const arch=new THREE.Group(); const stone=new THREE.MeshStandardMaterial({color:0xc58b3a,roughness:.75});
arch.add(new THREE.Mesh(new THREE.BoxGeometry(30,30,7),stone)); const hole=new THREE.Mesh(new THREE.BoxGeometry(13,20,8),new THREE.MeshStandardMaterial({color:0x070b12})); hole.position.y=-1; arch.add(hole); const dome=new THREE.Mesh(new THREE.SphereGeometry(13,32,16,0,Math.PI*2,0,Math.PI/2),stone); dome.position.y=15; arch.add(dome); arch.position.set(-42,15,0); scene.add(arch);
// Bara Imambara inspired dome
const im=new THREE.Group(); const cream=new THREE.MeshStandardMaterial({color:0x8d95a5,roughness:.8}); const hall=box(28,0,5,38,12,18,0x4c5565); im.add(hall); const dome2=new THREE.Mesh(new THREE.SphereGeometry(13,40,20,0,Math.PI*2,0,Math.PI/2),cream); dome2.position.set(28,25,5); im.add(dome2); const fin=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,13,16),new THREE.MeshStandardMaterial({color:0xf0c34e}));fin.position.set(28,39,5);im.add(fin);scene.add(im);
// river-like reflective strip
const water=new THREE.Mesh(new THREE.PlaneGeometry(240,16),new THREE.MeshStandardMaterial({color:0x123b63,metalness:.2,roughness:.15}));water.rotation.x=-Math.PI/2;water.position.set(0,.06,-65);scene.add(water);
// glowing city lights
const pts=[];for(let i=0;i<100;i++)pts.push((Math.random()-.5)*150,2+Math.random()*18,(Math.random()-.5)*100);const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0xffcf55,size:1.5,transparent:true,opacity:.8})));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();
</script>
</body></html>
