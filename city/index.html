<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hardik Dhamija · Lucknow Real-Time 3D</title>
<style>
:root{--bg:#050914;--glass:#08101dcc;--line:#314158;--gold:#f4c95d}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Inter,system-ui,Segoe UI,sans-serif}
canvas{display:block}
#hud{position:fixed;z-index:5;left:24px;top:20px;pointer-events:none;text-shadow:0 2px 18px #000}
#hud .eyebrow{font-size:11px;letter-spacing:3px;color:#75e3a1;font-weight:800}
#hud h1{margin:6px 0 2px;font-size:34px;letter-spacing:.3px}
#hud p{margin:0;color:#c2cedd;font-size:14px}
#badge{position:fixed;z-index:5;right:22px;top:20px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);font-size:12px;color:#dce8f5}
#hint{position:fixed;z-index:5;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);color:#dce8f5;font-size:13px;white-space:nowrap}
#legend{position:fixed;z-index:5;left:24px;bottom:22px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--glass);backdrop-filter:blur(10px);color:#aebbd0;font-size:12px;line-height:1.55}
</style>
</head>
<body>
<div id="hud"><div class="eyebrow">REAL-TIME 3D CITY · INDIA</div><h1>Lucknow, Uttar Pradesh</h1><p>Hardik Dhamija · interactive landmarks · animated traffic · day/night cycle</p></div>
<div id="badge">● LIVE SCENE</div>
<div id="legend">Rumi Darwaza · Bara Imambara · Hazratganj · Gomti River</div>
<div id="hint">🖱️ Drag rotate · Wheel zoom · Right-drag pan · Auto-rotates</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07101d);
scene.fog=new THREE.Fog(0x07101d,100,360);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,700);
camera.position.set(125,105,145);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.055; controls.autoRotate=true; controls.autoRotateSpeed=.22;
controls.minDistance=55; controls.maxDistance=300; controls.maxPolarAngle=Math.PI*.49;

const hemi=new THREE.HemisphereLight(0xbdd8ff,0x182235,1.65); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffd28a,3.5); sun.position.set(90,150,65); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); scene.add(sun);
const moon=new THREE.DirectionalLight(0x6f91ff,0); moon.position.set(-100,130,-80); scene.add(moon);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(360,280),new THREE.MeshStandardMaterial({color:0x101923,roughness:.94}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

function mat(color,rough=.75,metal=0){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});}
function box(x,y,z,w,h,d,c,material=mat(c)){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
function cyl(x,y,z,r,h,c,segments=32){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.9,h,segments),mat(c,.65));m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
function sphere(x,y,z,r,c){const m=new THREE.Mesh(new THREE.SphereGeometry(r,28,18),mat(c,.55));m.position.set(x,y+r,z);m.castShadow=true;scene.add(m);return m;}

// Roads / Hazratganj grid
const roadMat=mat(0x111821,.92);
function road(x,z,w,d){const r=new THREE.Mesh(new THREE.BoxGeometry(w,.18,d),roadMat);r.position.set(x,.08,z);r.receiveShadow=true;scene.add(r);}
road(0,0,280,22); road(0,70,280,18); road(-70,0,18,190); road(70,0,18,190);
for(let x=-130;x<=130;x+=14) road(x,0,3,.65);
for(let z=-85;z<=85;z+=14) road(0,z,.65,3);

// Gomti River — broad reflective ribbon
const river=new THREE.Mesh(new THREE.PlaneGeometry(330,48),new THREE.MeshPhysicalMaterial({color:0x14527a,roughness:.12,metalness:.25,transmission:.05,clearcoat:1,clearcoatRoughness:.08}));
river.rotation.x=-Math.PI/2; river.position.set(0,.18,-96); scene.add(river);
for(let x=-150;x<=150;x+=18){const wave=new THREE.Mesh(new THREE.TorusGeometry(5,.08,8,32),mat(0x65c7ef,.25,.4));wave.rotation.x=Math.PI/2;wave.position.set(x,.35,-96+Math.sin(x)*3);scene.add(wave);}

// City buildings with animated window lights
const windowMeshes=[];
for(let i=-6;i<=6;i++) for(let j=-3;j<=4;j++){
  if(Math.abs(i)+Math.abs(j)<2) continue;
  const x=i*22+(j%2)*4, z=j*20+25;
  const h=10+((i*i*7+j*j*11)%24);
  const c=[0x273243,0x313d50,0x39465a][Math.abs(i+j)%3];
  box(x,0,z,13,h,12,c);
  for(let yy=4;yy<h-2;yy+=5) for(let xx=-4;xx<=4;xx+=4){
    const w=box(x+xx,yy,z-6.08,1.8,1.3,.12,0xf2c95c,mat(0xf2c95c,.3,.1));
    windowMeshes.push(w);
  }
}

// Rumi Darwaza inspired landmark, detailed and lit
const rumi=new THREE.Group(); rumi.position.set(-66,0,15); scene.add(rumi);
const stone=mat(0xb8792d,.62,0.03), dark=mat(0x07101a,.92);
const base=new THREE.Mesh(new THREE.BoxGeometry(34,25,8),stone);base.position.y=12.5;base.castShadow=true;rumi.add(base);
const opening=new THREE.Mesh(new THREE.BoxGeometry(14,18,8.5),dark);opening.position.set(0,8,0);rumi.add(opening);
const crown=new THREE.Mesh(new THREE.SphereGeometry(13,40,20,0,Math.PI*2,0,Math.PI/2),stone);crown.position.y=25; crown.castShadow=true;rumi.add(crown);
const finial=new THREE.Mesh(new THREE.ConeGeometry(2.2,8,24),mat(0xf4c95d,.5));finial.position.y=36;rumi.add(finial);
for(const sx of [-14,14]){const tower=cyl(sx,0,0,3.2,29,0xb8792d,24);rumi.add(tower);const cap=sphere(sx,29,0,3.7,0xc9913d);rumi.add(cap);}

// Bara Imambara inspired complex with central dome and minarets
const im=new THREE.Group(); im.position.set(34,0,18); scene.add(im);
const hall=new THREE.Mesh(new THREE.BoxGeometry(52,14,24),mat(0x8e96a3,.82));hall.position.y=7;hall.castShadow=true;im.add(hall);
const dome=new THREE.Mesh(new THREE.SphereGeometry(16,48,24,0,Math.PI*2,0,Math.PI/2),mat(0xc8cdd4,.7));dome.position.y=14;dome.scale.z=.72;dome.castShadow=true;im.add(dome);
for(const x of [-23,23]){const tower=new THREE.Mesh(new THREE.CylinderGeometry(2.7,3.2,30,28),mat(0x9ea5af,.75));tower.position.set(x,15,0);tower.castShadow=true;im.add(tower);const cap=new THREE.Mesh(new THREE.ConeGeometry(4,6,28),mat(0xd6d9df,.7));cap.position.set(x,33,0);im.add(cap);}
const fin2=new THREE.Mesh(new THREE.CylinderGeometry(.8,.8,10,18),mat(0xf4c95d,.45));fin2.position.y=38;im.add(fin2);

// Hazratganj-style lamp posts
const lamps=[];
for(let x=-125;x<=125;x+=25){for(const z of [12,-12]){cyl(x,0,z,.45,8,0x202a37,12);const l=sphere(x,8,z,.8,0xffd75c);lamps.push(l);}}

// Trees
function tree(x,z){cyl(x,0,z,.9,5,0x5b3a22,12);sphere(x,5,z,3.6,0x176b42);sphere(x-2,6,z,2.7,0x1d7d4c);sphere(x+2,6,z,2.8,0x155c3a);}
for(let x=-135;x<=135;x+=18){tree(x,42); if(x%36===0) tree(x,-35);}

// Animated traffic — headlights moving around a rectangular route
const cars=[];
const carColors=[0xd33f49,0x3e82f7,0xf4c95d,0xe9ecef,0x38b26c];
for(let i=0;i<18;i++){const g=new THREE.Group();const body=box(0,0,0,4.8,1.3,2.2,carColors[i%carColors.length]);g.add(body);const roof=box(0,1.3,0,2.8,1.0,1.8,0x18212e);g.add(roof);const head1=sphere(-1.7,1.05,-1.0,.18,0xffffff);const head2=sphere(1.7,1.05,-1.0,.18,0xffffff);g.add(head1,head2);scene.add(g);cars.push({g,t:i/18*4});}

// Street light glow sprites
const glow=new THREE.PointLight(0xffc75a,1.2,24);glow.position.set(0,12,0);scene.add(glow);

// Star field
const starGeo=new THREE.BufferGeometry(), arr=[];
for(let i=0;i<500;i++) arr.push((Math.random()-.5)*500,80+Math.random()*180,(Math.random()-.5)*420);
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xa8c8ff,size:1.4,transparent:true,opacity:.75})));

function moveCar(car,time){
  const t=(time*.035+car.t)%4;
  const p=t<1?t:t<2?1:t<3?3-t:0;
  const x=-135+270*p;
  const z= t<1 ? 12 : t<2 ? 12-108*(t-1) : t<3 ? -96 : -96+108*(t-3);
  car.g.position.set(x,1.2,z);
  car.g.rotation.y=t<1||t>=3?0:Math.PI/2;
}
let phase=0;
function animate(){
  requestAnimationFrame(animate); phase+=.004;
  const daylight=(Math.sin(phase)+1)/2;
  sun.intensity=.7+2.9*daylight; moon.intensity=.05+1.0*(1-daylight);
  scene.background.lerpColors(new THREE.Color(0x07101d),new THREE.Color(0x7db9e8),daylight*.38);
  scene.fog.color.copy(scene.background);
  hemi.intensity=.55+1.25*daylight;
  windowMeshes.forEach((m,i)=>{const on=((i+Math.floor(phase*12))%5!==0);m.material.emissive.set(on?0xf2c95c:0x1d2733);m.material.emissiveIntensity=on?daylight<.45?1.7:.35:0;});
  lamps.forEach((l,i)=>{l.material.emissive.set(0xffc75a);l.material.emissiveIntensity=(1-daylight)*1.8;});
  cars.forEach(c=>moveCar(c,performance.now()/1000));
  controls.update(); renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body></html>
