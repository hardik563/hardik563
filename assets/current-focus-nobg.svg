<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="730" viewBox="0 0 1500 730" role="img" aria-label="Hardik Dhamija current focus — AI and ML, deep learning, full-stack development, DSA in Java, software engineering, and Callivo">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#151a22"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style><![CDATA[
    .display{font-family:Inter,Segoe UI,sans-serif;font-size:36px;font-weight:800;fill:#fff}
    .tag{font-family:Inter,Segoe UI,sans-serif;font-size:14px;font-weight:700;letter-spacing:4px;fill:#c4b5fd}
    .title{font-family:Inter,Segoe UI,sans-serif;font-size:23px;font-weight:800;fill:#fff}
    .desc{font-family:Inter,Segoe UI,sans-serif;font-size:15px;font-weight:500;fill:#c9cdd3}
    .pill{font-family:Consolas,monospace;font-size:12px;font-weight:700}
    .status{font-family:Inter,Segoe UI,sans-serif;font-size:10px;font-weight:800;letter-spacing:2px}
    .tile{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .dot{animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{50%{r:8;opacity:.45}}
  ]]></style>
</defs>
<rect width="1500" height="730" rx="18" fill="url(#bg)"/>
