<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-label="Lucknow, Uttar Pradesh 3D city visual for Hardik Dhamija">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#070b12"/><stop offset="1" stop-color="#1b1114"/></linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#171b22"/><stop offset=".5" stop-color="#24212a"/><stop offset="1" stop-color="#11151c"/></linearGradient>
 <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFD23F"/><stop offset="1" stop-color="#F90001"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style><![CDATA[.title{font:900 42px Inter,Segoe UI,sans-serif;fill:#fff}.sub{font:600 15px Inter,Segoe UI,sans-serif;letter-spacing:4px;fill:#c4b5fd}.lbl{font:800 16px Inter,Segoe UI,sans-serif;fill:#fff}.tiny{font:600 12px Inter,Segoe UI,sans-serif;fill:#9ba1a6}]]></style>
</defs>
<rect width="1400" height="520" rx="20" fill="url(#sky)"/>
<circle cx="1140" cy="100" r="58" fill="#FFD23F" opacity=".18" filter="url(#glow)"/><circle cx="1140" cy="100" r="25" fill="#FFD23F" opacity=".8"/>
<text x="55" y="65" class="sub">MY CITY · MY HOME</text><text x="55" y="115" class="title">Lucknow, Uttar Pradesh</text><text x="55" y="145" class="tiny">A custom 3D-style city panel for Hardik Dhamija · India 🇮🇳</text>
<!-- ground --> <path d="M0 430 Q300 390 600 430 T1200 420 T1400 430 V520 H0Z" fill="url(#ground)"/>
<!-- skyline back -->
<g opacity=".65" fill="#30343d"><rect x="40" y="330" width="95" height="100"/><rect x="155" y="300" width="110" height="130"/><rect x="280" y="350" width="85" height="80"/><rect x="380" y="285" width="120" height="145"/><rect x="520" y="320" width="90" height="110"/><rect x="635" y="290" width="110" height="140"/><rect x="770" y="340" width="100" height="90"/><rect x="895" y="300" width="90" height="130"/><rect x="1010" y="330" width="125" height="100"/><rect x="1160" y="290" width="105" height="140"/><rect x="1290" y="335" width="80" height="95"/></g>
<!-- stylized Rumi Darwaza -->
<g transform="translate(170 205)"><path d="M0 225 L0 90 Q100 0 200 90 V225 Z" fill="#343842" stroke="#FFD23F" stroke-width="3"/><path d="M40 225 V110 Q100 55 160 110 V225" fill="#11151c" stroke="#FF652F" stroke-width="4"/><path d="M35 90 Q100 20 165 90" fill="none" stroke="#FFD23F" stroke-width="10"/><circle cx="100" cy="36" r="18" fill="#FFD23F"/><path d="M25 70 L55 20 L100 0 L145 20 L175 70" fill="#252a33" stroke="#FF652F" stroke-width="3"/></g>
<!-- stylized Bara Imambara dome -->
<g transform="translate(570 190)"><rect x="0" y="150" width="280" height="80" fill="#30343d" stroke="#A78BFA" stroke-width="3"/><path d="M35 150 Q140 10 245 150Z" fill="#4a4551" stroke="#FFD23F" stroke-width="3"/><ellipse cx="140" cy="95" rx="38" ry="48" fill="#11151c" stroke="#FF652F" stroke-width="4"/><path d="M140 0 L140 42" stroke="#FFD23F" stroke-width="5"/><circle cx="140" cy="0" r="7" fill="#FFD23F"/><rect x="15" y="125" width="35" height="105" fill="#393e47"/><rect x="230" y="125" width="35" height="105" fill="#393e47"/></g>
<!-- foreground buildings -->
<g fill="#3a3f49" stroke="#555b66" stroke-width="2"><path d="M930 430 V235 L990 190 L1050 235 V430Z"/><path d="M1080 430 V250 L1140 205 L1200 250 V430Z"/><path d="M1225 430 V220 L1280 180 L1335 220 V430Z"/></g>
